# Sign-in (M-054): the token sign-in of an e2e build reaches the three tabs, each read from its plane.
appId: ai.datalayer.mobile.preview
name: Sign in
---
- runFlow: common/sign-in.yaml
- assertVisible: "Agents"
- assertVisible: "Activity"
- tapOn: "Agents"
- extendedWaitUntil:
    visible: "Applications"
    timeout: 30000
- tapOn: "Activity"
- extendedWaitUntil:
    visible: "In progress"
    timeout: 30000
