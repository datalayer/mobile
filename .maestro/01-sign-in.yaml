# Sign-in: the token sign-in of an e2e build reaches the three tabs, each read from its plane.
appId: ai.datalayer.mobile.preview
name: Sign in
---
- runFlow: common/sign-in.yaml
- assertVisible:
    id: "tab-agents"
- assertVisible:
    id: "tab-activity"
- tapOn:
    id: "tab-agents"
- extendedWaitUntil:
    visible: "Applications"
    timeout: 30000
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "In progress"
    timeout: 30000
