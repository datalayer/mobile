# Approval race and stale state (M-020, M-026): answered elsewhere while it is open, the phone says so and does not decide again.
# Open the confirmation before the other client rejects. This deliberately holds
# the version the person reviewed, so Confirm must refetch and refuse the stale
# decision even if the live query has already reconciled underneath the sheet.
appId: ai.datalayer.mobile.preview
name: Approval race
---
- runFlow: common/sign-in.yaml
- runScript: scripts/create-approval.js
- openLink: "datalayer-preview://approvals/${output.approvalId}"
- runFlow: common/open-link-ios.yaml
- extendedWaitUntil:
    visible: "Waiting for your answer."
    timeout: 30000
- tapOn:
    id: "approve"
- extendedWaitUntil:
    visible:
      id: "decision-confirm"
    timeout: 10000
- runScript: scripts/reject-elsewhere.js
- tapOn:
    id: "decision-confirm"
- extendedWaitUntil:
    visible: "It was answered somewhere else, or the run waiting on it is over. This is its current state."
    timeout: 30000
- extendedWaitUntil:
    visible: "Rejected."
    timeout: 30000
- assertNotVisible:
    id: "approve"
- runScript: scripts/still-rejected.js
