# Prompt, stream and stop (M-030): a new conversation with the kept-running application E2E_CHAT_APP,
# a streamed answer, then a long answer stopped while it streams, and the conversation ended. Two model requests.
appId: ai.datalayer.mobile.preview
name: Prompt, stream and stop
---
- runFlow: common/sign-in.yaml
- tapOn:
    id: "tab-agents"
- extendedWaitUntil:
    visible: ".*${E2E_CHAT_APP}.*"
    timeout: 30000
- tapOn: ".*${E2E_CHAT_APP}.*"
- tapOn:
    id: "conversation-new"
- extendedWaitUntil:
    visible:
      id: "conversation-message"
    timeout: 60000
- tapOn:
    id: "conversation-message"
- inputText: "Reply with exactly PAP MOBILE STREAM OK and nothing else. Do not use any tool."
- tapOn:
    id: "conversation-send"
- extendedWaitUntil:
    visible: ".*PAP MOBILE STREAM OK.*"
    timeout: 120000
- assertVisible:
    id: "conversation-send"
- tapOn:
    id: "conversation-message"
- inputText: "Count upward indefinitely, one number per line, until I stop you. Do not use any tool."
- tapOn:
    id: "conversation-send"
    # A streaming view never becomes still. Continue immediately so the next
    # command can press Stop while the real server turn is still in flight.
    waitToSettleTimeoutMs: 0
# `tapOn` waits for the control and acts as soon as React exposes it. Do not
# poll first: the plain E2E agent may otherwise finish between the poll and tap.
- tapOn:
    id: "conversation-stop"
- extendedWaitUntil:
    visible:
      id: "turn-end-stopped"
    timeout: 60000
- assertNotVisible:
    id: "conversation-stop"
- tapOn: "End"
- tapOn: "End"
