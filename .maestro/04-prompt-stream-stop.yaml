# Prompt, stream and stop: a new conversation with the application E2E_CHAT_APP, a streamed answer,
# then a long answer stopped while it streams, and the conversation ended. Two model requests.
# Where the conversation is had is ai-agents' answer, read first (scripts/chat-reach.js): on its owner's
# kept computer when that answers, on one of the test account's own already running for it, or — when
# nothing runs it — on one this flow starts with Start and continue, which the workflow's e2e-cleanup job
# stops afterwards. The flow does not depend on the kept computer staying up.
appId: ai.datalayer.mobile.preview
name: Prompt, stream and stop
---
- runFlow: common/sign-in.yaml
- tapOn:
    id: "tab-agents"
# The list puts recently started applications first: scroll to this one.
- scrollUntilVisible:
    element: ".*${E2E_CHAT_APP}.*"
    timeout: 30000
    centerElement: true
- tapOn: ".*${E2E_CHAT_APP}.*"
- runScript: scripts/chat-reach.js
- tapOn:
    id: "conversation-new"
# Nothing runs it for the account: the phone says so and offers to start a computer of its own.
- runFlow:
    when:
      true: ${output.chatReach == 'launch'}
    commands:
      - tapOn:
          id: "conversation-start-runtime"
- extendedWaitUntil:
    visible:
      id: "conversation-message"
    timeout: 300000
- tapOn:
    id: "conversation-message"
- inputText: "Reply with exactly PAP MOBILE STREAM OK and nothing else. Do not use any tool."
- tapOn:
    id: "conversation-send"
- extendedWaitUntil:
    visible: ".*PAP MOBILE STREAM OK.*"
    timeout: 120000
# The turn ends at RUN_FINISHED, which the runtime can send a minute or more after the last words
# (iOS run 39279827352, Android run 39287231601): Send comes back then.
- extendedWaitUntil:
    visible:
      id: "conversation-send"
    timeout: 150000
- tapOn:
    id: "conversation-message"
- inputText: "Call runtime_echo exactly once with a text argument made of 12000 lowercase x characters. Do not answer or summarize before the tool completes."
- tapOn:
    id: "conversation-send"
    # A streaming view never becomes still. Continue immediately so the next
    # command can press Stop while the real server turn is still in flight.
    waitToSettleTimeoutMs: 0
# `tapOn` waits for the control and acts as soon as React exposes it. Do not
# poll first: the plain E2E agent may otherwise finish between the poll and tap.
- tapOn:
    id: "conversation-stop"
- extendedWaitUntil:
    visible:
      id: "turn-end-stopped"
    timeout: 60000
- assertNotVisible:
    id: "conversation-stop"
- tapOn: "End"
- tapOn: "End"
