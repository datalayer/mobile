# Notification deep link (M-025): an approval's notification opens /approvals/{id}, fetched again on opening.
# The emulator has no push credentials: the flow opens the route a tapped notification opens, from the
# background, through the build's scheme, then answers it there.
appId: ai.datalayer.mobile.preview
name: Notification deep link
---
- runFlow: common/sign-in.yaml
- runScript: scripts/create-approval.js
- pressKey: Home
- openLink: "datalayer-preview://approvals/${output.approvalId}"
- runFlow: common/open-link-ios.yaml
- extendedWaitUntil:
    visible: "Waiting for your answer."
    timeout: 30000
- tapOn:
    id: "reject"
- tapOn:
    id: "decision-confirm"
- extendedWaitUntil:
    visible: "Rejected."
    timeout: 30000
- openLink: "datalayer-preview://approvals/not-an-approval"
- runFlow: common/open-link-ios.yaml
- extendedWaitUntil:
    visible: "This item is no longer available."
    timeout: 30000
