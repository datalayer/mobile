# Signs in with the test account's API token: the development sign-in an e2e build offers.
appId: ai.datalayer.mobile.preview
---
# Launched again once when it does not come up: on the emulator the old task's late removal once
# killed the new process, which stayed on the splash screen (run 38923345444). iOS SecureStore can
# retain the E2E grant even when Maestro clears application state, so this setup accepts the already
# authenticated Inbox as well as the sign-in screen. Every flow remains runnable by itself.
# A system dialog a failed flow left on the iOS Simulator (the open-link question) would hide the app
# from every later flow: it is dismissed first.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible: "Sign in to Datalayer|Inbox"
          timeout: 60000
# The check for the sign-in screen is made again when the Inbox does not come: on the iOS
# Simulator a kept grant can show the Inbox for a moment before the app signs out, and the
# first check then skipped the sign-in and waited on the sign-in screen (run 39449218343).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Sign in to Datalayer"
          commands:
            - tapOn: "Use an API token instead"
            - tapOn: "Datalayer API token"
            - inputText: ${E2E_TOKEN}
            - hideKeyboard
            - tapOn: "Sign in"
      - extendedWaitUntil:
          visible: "Inbox"
          timeout: 30000
