# Maestro smoke flows of MOBILE M-054, run by the `e2e-android` job of
# .github/workflows/check.yaml on an e2e build (APP_VARIANT=preview,
# EXPO_PUBLIC_BUILD_PROFILE=e2e) against the r1 runtimes plane. Each flow is
# given the test account's token (E2E_TOKEN), a second account's (E2E_SECOND_TOKEN),
# the planes (E2E_RUN_URL, E2E_RUNTIMES_URL) and the applications it uses.
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  # A single local emulator/simulator is shared by the suite. Keep sign-in
  # first, then run every independently prepared journey in a deterministic
  # order so a long conversation cannot overlap another flow's app reset.
  flowsOrder:
    - 01-sign-in
    - 02-approval-race
    - 03-notification-deep-link
    - 04-prompt-stream-stop
    - 05-pause-reset-authorization
