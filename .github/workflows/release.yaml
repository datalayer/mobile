# A release, on a version tag (`v1.2.3`): the checks, then EAS builds the
# store `.aab` and `.ipa` from this commit and EAS Submit sends the `.aab` to
# Google Play's internal testing track as a completed release (eas.json,
# submit.production.android), the internal testers get it at once, and the
# `.ipa` to App Store Connect (submit.production.ios), where it is processed
# for TestFlight. Promotion to closed testing and production on Google Play, and
# TestFlight testing and App Review on the App Store, are the release owner's,
# by hand in the consoles (README, Releasing).
#
# iOS is on since 5 November 2026 (Datalayer is enrolled in the Apple Developer
# Program; iOS was off from 20 October while Apple validated the account). An
# iOS release needs, besides what Android needs:
# - submit.production.ios in eas.json filled with the App Store Connect app id
#   (ascAppId, the numeric Apple ID of the app record) and the Apple team id
#   (appleTeamId). The placeholders ASC_APP_ID_PLACEHOLDER and
#   APPLE_TEAM_ID_PLACEHOLDER stand there until the account holder gives them:
#   the step "The App Store Connect ids are in eas.json" refuses them, loudly,
#   before anything is built, so a release never skips iOS silently;
# - the iOS distribution certificate and provisioning profile in EAS
#   (`eas credentials --platform ios`, signed in with the Apple account);
#   --freeze-credentials never creates them;
# - the App Store Connect API key in EAS. EAS Submit's iOS configuration
#   (docs.expo.dev/submit/eas-json) takes the key from eas.json
#   (ascApiKeyPath, ascApiKeyId, ascApiKeyIssuerId) or, when those are not set,
#   as here, from the key stored in EAS credentials for the project (put there
#   with `eas credentials --platform ios` → App Store Connect API Key, or by a
#   first interactive `eas submit`). With --non-interactive and no key in EAS,
#   the submit fails instead of asking. So no repository secret carries it:
#   the `.ipa` goes up with EAS's stored key, as the `.aab` goes with the
#   Play service account's; EXPO_ASC_API_KEY_PATH and the EXPO_APPLE_* variables
#   are not used;
# - EAS's iOS build number above the one already in App Store Connect (the
#   first build was uploaded by hand from Xcode on 19 October 2026):
#   `eas build:version:set --platform ios` once, before the first tag (README,
#   Publish).
#
# Needs the repository secrets EXPO_TOKEN (an Expo robot token) and
# DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT (the Google Play service account's JSON
# key, with the release permissions on `ai.datalayer.mobile`), and the Android
# upload key kept in EAS (`eas credentials`). The app's first bundle
# (versionCode 5) was put on the internal testing track, completed, outside this
# workflow on 20 October 2026; each tag adds the next versionCode.
#
# Before anything is built, the tagged commit's Check run must have passed the
# jobs a release rests on: check, doctor, manifests (the generated privacy
# manifest, Info.plist and Android permissions), hermes, e2e-account and the
# Android Maestro flows (e2e-android). The iOS Maestro flows (e2e-ios) stay off
# in check.yaml until the Simulator sign-in is fixed (its `if: false &&`), so
# they and the store screenshots do not block a release; add e2e-ios to
# RELEASE_JOBS when that job runs again.
# The repository commits no lockfile (the monorepo's rule): the lockfile this
# install resolved is kept as the release's artifact, its checksum in the notes.
# EAS installs with `npm install` too (eas.json's base profile:
# EAS_FALLBACK_PACKAGE_MANAGER=npm, EAS_NO_FROZEN_LOCKFILE), never yarn.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NO_COLOR: '1'
    steps:
      - name: The release secrets are set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$EXPO_TOKEN" ] || missing="$missing secret EXPO_TOKEN (an Expo robot token of the datalayer account);"
          [ -n "$PLAY_SERVICE_ACCOUNT" ] || missing="$missing secret DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT (the Google Play service account's JSON key, README, Releasing);"
          if [ -n "$missing" ]; then
            echo "A release needs the repository's$missing nothing was built." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # iOS is on: a release goes to both stores, so the placeholders stop it before any
      # build, never silently skipping the App Store (top of this file).
      - name: The App Store Connect ids are in eas.json
        run: |
          node -e '
            const ios = require("./eas.json").submit.production.ios;
            const problems = [];
            if (!/^\d+$/.test(ios.ascAppId ?? "")) problems.push(`ascAppId is "${ios.ascAppId}", not the App Store Connect app id (the numeric Apple ID of the app record)`);
            if (!/^[A-Z0-9]{10}$/.test(ios.appleTeamId ?? "")) problems.push(`appleTeamId is "${ios.appleTeamId}", not the Apple team id`);
            if (problems.length) {
              console.error("An iOS release needs submit.production.ios in eas.json filled by the account holder: " + problems.join("; ") + ". Nothing was built.");
              process.exit(1);
            }
          '
      - name: The tagged commit's Check passed, the jobs a release rests on
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: check doctor manifests hermes e2e-account e2e-android
        run: |
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yaml --commit "$GITHUB_SHA" \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          if [ -z "$run" ]; then
            echo "Check on ${GITHUB_SHA} has not completed: a release needs it (README, Release-owner checklist)." >&2
            exit 1
          fi
          failed=""
          for job in $RELEASE_JOBS; do
            conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq ".jobs[] | select(.name == \"$job\") | .conclusion")"
            [ "$conclusion" = "success" ] || failed="$failed $job (${conclusion:-absent})"
          done
          if [ -n "$failed" ]; then
            echo "Check ${run} on ${GITHUB_SHA} did not pass:${failed}. A release needs ${RELEASE_JOBS} green (README, Release-owner checklist)." >&2
            exit 1
          fi
      # EAS builds only a clean tree (requireCommit), so the key goes outside the checkout,
      # readable by this job alone, and is removed when the job ends. eas.json's
      # submit.production.android.serviceAccountKeyPath reads its path from
      # DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT_KEY_PATH.
      - name: The Google Play service account key, outside the checkout
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/play-service-account.json"
          (umask 077 && printf '%s' "$PLAY_SERVICE_ACCOUNT" > "$key")
          node -e '
            let key;
            try { key = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); } catch { key = null; }
            if (!key || key.type !== "service_account" || !key.client_email || !key.private_key) {
              console.error("The secret DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT is not a Google service account JSON key (type service_account, client_email, private_key).");
              process.exit(1);
            }
          ' "$key"
          echo "DATALAYER_MOBILE_PLAY_SERVICE_ACCOUNT_KEY_PATH=$key" >> "$GITHUB_ENV"
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: The lockfile this install resolved
        run: sha256sum package-lock.json | tee "$RUNNER_TEMP/package-lock.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-lockfile
          path: |
            package-lock.json
            ${{ runner.temp }}/package-lock.sha256
          retention-days: 90
      - name: The tag names the app's version
        run: |
          version="$(npx expo config --json --type public | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match version ${version} in app.config.ts." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run check:bundle
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}
      # --freeze-credentials: CI uses the signing credentials kept in EAS and never creates any; a missing
      # one fails the build. The Android upload key (the keystore EAS holds for ai.datalayer.mobile,
      # Play App Signing's upload key) and the iOS distribution certificate and provisioning profile
      # are put in EAS by an account holder (`eas credentials`). Both platforms are built before
      # either is submitted: a build that fails leaves nothing half-released.
      - name: Build the Android store bundle
        run: |
          eas build --platform android --profile production --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/builds-android.json"
          node -e '
            const [build] = require(process.argv[1]);
            if (!build || build.platform !== "ANDROID" || build.status !== "FINISHED") {
              console.error("EAS did not finish an Android build: " + JSON.stringify(build && { id: build.id, status: build.status }));
              process.exit(1);
            }
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `BUILD_ID=${build.id}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "### Store releases",
              "",
              `- Tag: ${process.env.GITHUB_REF_NAME} (${process.env.GITHUB_SHA})`,
              `- EAS Android build: ${build.id}, version ${build.appVersion}, versionCode ${build.appBuildVersion}`,
              `- Bundle: ${build.artifacts?.applicationArchiveUrl ?? build.artifacts?.buildUrl ?? "see EAS"}`,
              ""
            ].join("\n"));
          ' "$RUNNER_TEMP/builds-android.json"
      - name: Build the iOS store archive
        run: |
          eas build --platform ios --profile production --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/builds-ios.json"
          node -e '
            const [build] = require(process.argv[1]);
            if (!build || build.platform !== "IOS" || build.status !== "FINISHED") {
              console.error("EAS did not finish an iOS build: " + JSON.stringify(build && { id: build.id, status: build.status }));
              process.exit(1);
            }
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `IOS_BUILD_ID=${build.id}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              `- EAS iOS build: ${build.id}, version ${build.appVersion}, build number ${build.appBuildVersion}`,
              `- Archive: ${build.artifacts?.applicationArchiveUrl ?? build.artifacts?.buildUrl ?? "see EAS"}`,
              ""
            ].join("\n"));
          ' "$RUNNER_TEMP/builds-ios.json"
      - name: Submit the bundle to Google Play's internal testing track
        run: |
          set -o pipefail
          eas submit --platform android --profile production --id "$BUILD_ID" --non-interactive --wait 2>&1 | tee "$RUNNER_TEMP/submit.log"
          url="$(grep -oE 'https://expo\.dev/accounts/[^ ]+/submissions/[0-9a-f-]+' "$RUNNER_TEMP/submit.log" | head -1)"
          echo "SUBMISSION_URL=${url}" >> "$GITHUB_ENV"
          {
            echo "- EAS Android submission: ${url##*/} (${url:-see EAS})"
            echo "- Google Play: internal testing track, completed release; promote it by hand in Play Console"
          } >> "$GITHUB_STEP_SUMMARY"
      # EAS Submit uploads the archive with the App Store Connect API key kept in EAS (top of this
      # file); App Store Connect processes it for TestFlight. --wait: a submission that App Store
      # Connect refuses (a build number not above the last, a missing agreement) fails this step.
      - name: Submit the archive to App Store Connect
        run: |
          set -o pipefail
          eas submit --platform ios --profile production --id "$IOS_BUILD_ID" --non-interactive --wait 2>&1 | tee "$RUNNER_TEMP/submit-ios.log"
          url="$(grep -oE 'https://expo\.dev/accounts/[^ ]+/submissions/[0-9a-f-]+' "$RUNNER_TEMP/submit-ios.log" | head -1)"
          echo "IOS_SUBMISSION_URL=${url}" >> "$GITHUB_ENV"
          {
            echo "- EAS iOS submission: ${url##*/} (${url:-see EAS})"
            echo "- App Store Connect: processed for TestFlight; test it there, then add it to the version record and submit it for App Review by hand"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(node -e '
            const temp = process.env.RUNNER_TEMP;
            const builds = [...require(temp + "/builds-android.json"), ...require(temp + "/builds-ios.json")];
            for (const b of builds) {
              console.log(`- ${b.platform}: build ${b.appBuildVersion} (${b.id}) — ${b.artifacts?.buildUrl ?? "see EAS"}`);
            }
          ')"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Submitted to Google Play internal testing (EAS submission ${SUBMISSION_URL##*/}) and to App Store Connect for TestFlight (EAS submission ${IOS_SUBMISSION_URL##*/}).

          ${notes}

          Lockfile (the release-lockfile artifact): sha256 $(cut -d' ' -f1 "$RUNNER_TEMP/package-lock.sha256")"
