# A release, on a version tag (`v1.2.3`): the checks, then EAS builds the
# store `.ipa` and `.aab` from this commit and submits them, the `.ipa` to
# App Store Connect (TestFlight) and the `.aab` as a draft on Google Play's
# internal track (eas.json, submit.production). Promotion to the stores'
# production is the release owner's, in the consoles (README, Publish).
#
# Needs the repository secret EXPO_TOKEN (an Expo robot token), and the
# signing and submit credentials kept in EAS (`eas credentials`).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: The tag names the app's version
        run: |
          version="$(npx expo config --json --type public | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match version ${version} in app.config.ts." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run check:bundle
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to App Store Connect and Google Play
        run: eas build --platform all --profile production --non-interactive --auto-submit --wait --json > builds.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(node -e '
            const builds = require("./builds.json");
            for (const b of builds) {
              console.log(`- ${b.platform}: build ${b.appBuildVersion} (${b.id}) — ${b.artifacts?.buildUrl ?? "see EAS"}`);
            }
          ')"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Submitted to TestFlight and Google Play internal testing.

          ${notes}"
