# The pull-request gate: types, lint, the import
# gate on the sources, the tests, and the import gate on what Metro resolved;
# the Expo/Hermes proof; and the Maestro smoke flows (.maestro/) on an e2e
# build, Android on every run, iOS on main, once the test account is set
# (e2e-account); the bundle-size budget (scripts/bundle-size.js).
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Outside the monorepo the @datalayer packages come from npm: the
      # Primer Addons release must carry lib/theme/portable.
      # onnxruntime-node (through agent-runtimes' voice) downloads its binaries in
      # a postinstall that times out on the runner; the check needs none of them.
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run check
      - run: npm run check:bundle

  # Expo Doctor on the repository as it installs outside the monorepo,
  # where the React the app ships is the only one (the workspace's root React
  # 19.2.8 beside Expo's 19.2.3 stays in the monorepo, held apart there by
  # metro.config.js and Jest's moduleNameMapper; here package.json's overrides
  # hold every dependency's React to the app's own). All 21 checks passed in
  # run 38895458353. A failure turns Check red, and release.yaml refuses a tag
  # whose Check is not green; main has no branch protection, so it blocks no merge.
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: The copies of React installed (Metro and Jest resolve the app's own)
        run: find node_modules -path '*/node_modules/react/package.json' -exec node -p "require('./{}').version + '  {}'" \; | sort
      - run: npm run doctor

  # The release manifests: the production app generated as a store build
  # generates it (no variant, no EAS profile), the release Android manifest merged
  # with every library's, and scripts/release-manifests.js holding the privacy
  # manifest, Info.plist and permissions to docs/privacy-and-store.md.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Prebuild the production app
        run: npx expo prebuild --platform all --no-install --clean
      - name: Merge the release Android manifest
        working-directory: android
        timeout-minutes: 25
        run: ./gradlew :app:processReleaseMainManifest --no-daemon | tail -40
      - run: node scripts/release-manifests.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifests
          path: |
            ios/*/PrivacyInfo.xcprivacy
            ios/*/Info.plist
            android/app/build/intermediates/merged_manifest*/release/**/AndroidManifest.xml
          if-no-files-found: ignore
          retention-days: 30

  # The Expo/Hermes proof: the shared portable entries, bundled by
  # this app's Metro from an entry that imports nothing else, compiled by the
  # hermesc React Native ships and run by the Hermes VM alone (no React Native
  # runtime, no DOM, no shim). The VM is built from the Hermes tag React Native
  # pins, so it reads that hermesc's bytecode.
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: The Hermes tag React Native pins
        id: tag
        run: |
          tag=$(cat node_modules/react-native/sdks/.hermesv1version)
          echo "Hermes $tag, hermes-compiler $(node -p "require('hermes-compiler/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: vm
        with:
          path: hermes-vm
          key: hermes-vm-${{ steps.tag.outputs.tag }}-${{ runner.os }}
      - name: Build the Hermes VM
        if: steps.vm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ninja-build libicu-dev
          git clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" https://github.com/facebook/hermes.git hermes-src
          cmake -S hermes-src -B hermes-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build hermes-build --target hermes
          mkdir -p hermes-vm && cp hermes-build/bin/hermes hermes-vm/
      - name: Bundle the proof with Metro
        run: |
          for platform in ios android; do
            npx expo export:embed --platform $platform --dev false --minify false \
              --entry-file scripts/hermes-proof/index.ts \
              --bundle-output dist/hermes/$platform/proof.js \
              --sourcemap-output dist/hermes/$platform/proof.js.map
          done
      - name: No forbidden module in the proof's bundles
        run: node scripts/check-bundle.js dist/hermes
      - name: Compile with React Native's hermesc and run under the Hermes VM
        run: |
          hermesc=node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          $hermesc -version | head -3
          ./hermes-vm/hermes -version | head -3
          for platform in ios android; do
            $hermesc -emit-binary -O -out dist/hermes/$platform/proof.hbc dist/hermes/$platform/proof.js
            ./hermes-vm/hermes dist/hermes/$platform/proof.hbc | tee dist/hermes/$platform/proof.txt
            grep -qx 'HERMES PROOF HELD' dist/hermes/$platform/proof.txt
          done

  # The Maestro flows need the test account: all four secrets are set
  # since 16 October 2026 12:37 UTC (the first flows ran in run 38901889765). A fork's
  # pull request, which gets no secrets, skips the e2e jobs cleanly and says so here.
  # Job conditions cannot read secrets, so this job reads them and says whether
  # all four are set.
  e2e-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.account.outputs.ready }}
    steps:
      - name: The test account
        id: account
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
          E2E_LIFECYCLE_APP: ${{ secrets.DATALAYER_MOBILE_E2E_LIFECYCLE_APP }}
        run: |
          missing=""
          [ -n "$E2E_TOKEN" ] || missing="$missing secret DATALAYER_MOBILE_E2E_TOKEN (the test account's API token);"
          [ -n "$E2E_SECOND_TOKEN" ] || missing="$missing secret DATALAYER_MOBILE_E2E_SECOND_TOKEN (a second account's API token);"
          [ -n "$E2E_CHAT_APP" ] || missing="$missing secret DATALAYER_MOBILE_E2E_CHAT_APP (an application of the test account the prompt flow talks to);"
          [ -n "$E2E_LIFECYCLE_APP" ] || missing="$missing secret DATALAYER_MOBILE_E2E_LIFECYCLE_APP (an application of the test account the flow pauses and resumes);"
          if [ -n "$missing" ]; then
            echo "::notice title=Maestro smoke flows skipped::e2e-android and e2e-ios are skipped until the test account is set:$missing in the repository's settings."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.account.outputs.ready == 'true'
      # Where the prompt flow's conversation will be had, and the free credits when it starts a
      # computer: a warning here is the reason that flow fails (Maestro says only "Unknown error").
      - name: The prompt flow's conversation
        if: steps.account.outputs.ready == 'true'
        continue-on-error: true
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
          E2E_RUNTIMES_URL: https://r1.datalayer.run
          E2E_RUN_URL: https://prod1.datalayer.run
        run: node scripts/e2e-chat-reach.mjs

  # The Maestro smoke flows on Android: an e2e build (APP_VARIANT=preview,
  # EXPO_PUBLIC_BUILD_PROFILE=e2e: the token sign-in is offered) made here — prebuild,
  # then Gradle, never on a laptop — installed on an emulator and driven against
  # the r1 runtimes plane as the test account. The flows need the test account's
  # API token (secret DATALAYER_MOBILE_E2E_TOKEN), a second account's (DATALAYER_MOBILE_E2E_SECOND_TOKEN)
  # and the applications they use (secrets DATALAYER_MOBILE_E2E_CHAT_APP, talked to,
  # and DATALAYER_MOBILE_E2E_LIFECYCLE_APP, which the flow pauses and resumes); without
  # them the job is skipped (e2e-account says which is missing).
  e2e-android:
    needs: e2e-account
    if: needs.e2e-account.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_BUILD_PROFILE: e2e
      EXPO_PUBLIC_DATALAYER_RUN_URL: https://prod1.datalayer.run
      EXPO_PUBLIC_DATALAYER_RUNTIMES_URL: https://r1.datalayer.run
      EXPO_PUBLIC_DATALAYER_MCP_URL: https://mcp.datalayer.run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Prebuild the e2e app
        run: npx expo prebuild --platform android --no-install --clean
      # The resources first, on their own: on 16 October 2026 their merge failed and the
      # build then waited on its native tasks until the job's limit, without saying why.
      - name: Merge the app's resources
        working-directory: android
        timeout-minutes: 15
        run: ./gradlew :app:mergeReleaseResources -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace --info | tail -200
      - name: Build the e2e APK (release, its JavaScript embedded; x86_64 for the emulator)
        working-directory: android
        timeout-minutes: 50
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
          E2E_LIFECYCLE_APP: ${{ secrets.DATALAYER_MOBILE_E2E_LIFECYCLE_APP }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            adb install -r android/app/build/outputs/apk/release/app-release.apk &&
            maestro test .maestro --format junit --output maestro-android.xml
            -e E2E_TOKEN="$E2E_TOKEN" -e E2E_SECOND_TOKEN="$E2E_SECOND_TOKEN"
            -e E2E_RUN_URL="$EXPO_PUBLIC_DATALAYER_RUN_URL" -e E2E_RUNTIMES_URL="$EXPO_PUBLIC_DATALAYER_RUNTIMES_URL"
            -e E2E_CHAT_APP="$E2E_CHAT_APP" -e E2E_LIFECYCLE_APP="$E2E_LIFECYCLE_APP"
      # Maestro's commands.json and maestro.log hold every -e value, the tokens among them, and
      # the screen hierarchies hold what was typed: this repository's artifacts are public. Those
      # files are dropped, any other holding a token too, and the step fails if one is left.
      - name: Keep the tokens out of the results
        id: scrub
        if: always()
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
        run: scripts/scrub-e2e-results.sh "$HOME/.maestro/tests" maestro-android.xml
      # Uploaded only once the scrub succeeded: a token left in the results fails it, and
      # then nothing is uploaded (`always()` alone would upload after that failure too).
      - uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: maestro-android
          path: |
            maestro-android.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  # The store screenshots (.maestro/store/screenshots.yaml): the e2e APK e2e-android built,
  # on a Pixel 2 emulator (1080 × 1920, 9:16, where the smoke flows' default one is 320 × 640),
  # with the status bar in demo mode, as the test account. On main and when dispatched, never on
  # a pull request; a failure here does not turn Check red. The PNGs alone are kept, through
  # the same token scrub, as the `store-screenshots` artifact.
  store-screenshots:
    needs: [e2e-account, e2e-android]
    if: always() && github.event_name != 'pull_request' && needs.e2e-account.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      EXPO_PUBLIC_DATALAYER_RUNTIMES_URL: https://r1.datalayer.run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-android-apk
          path: apk
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/app-release.apk
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e fully true -e mobile hide
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            maestro test .maestro/store/screenshots.yaml --test-output-dir store-output -e E2E_TOKEN="$E2E_TOKEN" -e E2E_RUNTIMES_URL="$EXPO_PUBLIC_DATALAYER_RUNTIMES_URL" -e E2E_CHAT_APP="$E2E_CHAT_APP"
      # takeScreenshot writes where Maestro is run or into its output directory: the
      # store-*.png are gathered from both, with the screenshots of a failed step, and
      # nothing else of Maestro's results is kept.
      - name: Gather the screenshots
        if: always()
        run: |
          mkdir -p store-screenshots
          find . "$HOME/.maestro/tests" -name 'store-*.png' -not -path './store-screenshots/*' -exec cp {} store-screenshots/ \; 2>/dev/null || true
          # The screen a failed step left, to see why (Maestro's own screenshots, under debug/).
          if [ -d store-output ]; then mkdir -p store-screenshots/debug; find store-output -path '*screenshots*' -name '*.png' -exec cp {} store-screenshots/debug/ \; ; fi
          ls -la store-screenshots
      - name: Keep the tokens out of the screenshots
        id: scrub
        if: always()
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
        run: scripts/scrub-e2e-results.sh store-screenshots
      - uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: store-screenshots
          path: store-screenshots
          if-no-files-found: ignore
          retention-days: 30

  # The same flows on an iOS Simulator build (macos-15: macos-13 is retired), on main only.
  e2e-ios:
    needs: e2e-account
    if: github.event_name != 'pull_request' && needs.e2e-account.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_BUILD_PROFILE: e2e
      EXPO_PUBLIC_DATALAYER_RUN_URL: https://prod1.datalayer.run
      EXPO_PUBLIC_DATALAYER_RUNTIMES_URL: https://r1.datalayer.run
      EXPO_PUBLIC_DATALAYER_MCP_URL: https://mcp.datalayer.run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      # The newest Xcode on the image: on 16 October 2026 the default one failed
      # expo-modules-jsi's "Build ExpoModulesJSI xcframework" phase (run 38901889765).
      - name: The newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun swiftc --version
      - name: Prebuild the e2e app
        run: npx expo prebuild --platform ios --clean
      # Signed to run locally (identity "-"), not unsigned: without a signature the app has no
      # keychain-access-groups entitlement and expo-secure-store cannot keep the session
      # ("A required entitlement isn't present", every flow in run 38913462098).
      # Stream the complete build to Actions while retaining the same output as
      # an artifact on failure. `pipefail` preserves xcodebuild's exit status;
      # `| tail -40` hid it in run 38901889765, which went on to install an app
      # without an Info.plist ("Missing bundle ID").
      - name: Build for the iOS Simulator (Release, its JavaScript embedded)
        run: |
          set -o pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          if ! xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build 2>&1 | tee xcodebuild.log; then
            grep -nE "error:|\[ExpoModulesJSI\]|BUILD FAILED|The following build commands failed" -A3 xcodebuild.log | tail -150
            exit 1
          fi
          app=$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows on a Simulator
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
          E2E_LIFECYCLE_APP: ${{ secrets.DATALAYER_MOBILE_E2E_LIFECYCLE_APP }}
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$device"
          xcrun simctl install "$device" "$APP_PATH"
          maestro --device "$device" test .maestro --format junit --output maestro-ios.xml \
            -e E2E_TOKEN="$E2E_TOKEN" -e E2E_SECOND_TOKEN="$E2E_SECOND_TOKEN" \
            -e E2E_RUN_URL="$EXPO_PUBLIC_DATALAYER_RUN_URL" -e E2E_RUNTIMES_URL="$EXPO_PUBLIC_DATALAYER_RUNTIMES_URL" \
            -e E2E_CHAT_APP="$E2E_CHAT_APP" -e E2E_LIFECYCLE_APP="$E2E_LIFECYCLE_APP"
      # Maestro's commands.json and maestro.log hold every -e value, the tokens among them, and
      # the screen hierarchies hold what was typed: this repository's artifacts are public. Those
      # files are dropped, any other holding a token too, and the step fails if one is left.
      - name: Keep the tokens out of the results
        id: scrub
        if: always()
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_SECOND_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_SECOND_TOKEN }}
        run: scripts/scrub-e2e-results.sh "$HOME/.maestro/tests" maestro-ios.xml
      # Uploaded only once the scrub succeeded: a token left in the results fails it, and
      # then nothing is uploaded (`always()` alone would upload after that failure too).
      - uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: maestro-ios
          path: |
            maestro-ios.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  # After every flow: the computers the prompt flow started for the test account's own
  # conversations with the chat test application (when nothing ran it) are stopped, so each
  # lives minutes rather than until its 10 credits are spent. Run once both platforms and the
  # screenshots are done, as they may share one; the kept computer and other runtimes stay.
  e2e-cleanup:
    needs: [e2e-account, e2e-android, e2e-ios, store-screenshots]
    if: always() && needs.e2e-account.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stop the conversation computers the flows started
        env:
          E2E_TOKEN: ${{ secrets.DATALAYER_MOBILE_E2E_TOKEN }}
          E2E_CHAT_APP: ${{ secrets.DATALAYER_MOBILE_E2E_CHAT_APP }}
          E2E_RUNTIMES_URL: https://r1.datalayer.run
        run: node scripts/stop-e2e-conversation-runtimes.mjs
